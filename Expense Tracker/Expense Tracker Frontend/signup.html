<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BudgetFlow</title>
    <link rel="stylesheet" href="styleET.css">
</head>
<body>
    <div class="Navbar">
        <h3 id="mainHeading">BudgetFlow</h3>
        <nav id="anchors"> 
            <a href="home.html">Home</a> |
            <a href="index1.html">Track Expenses</a> |
            <a href="login.html">Login/Signup</a>
        </nav>
    </div>

    <div class="auth-container">
        <h2>Sign Up</h2>
        <form id="signup" onsubmit="event.preventDefault(); signup();">
            <input id="username" type="text" placeholder="Username" required />
            <input id="password" type="password" placeholder="Password" required />

            <button type="submit" id="registerBtn">Register</button>

            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

    <footer>
        <p>© 2026 Personal Expense Tracker</p>
    </footer>

    <script>
    function signup() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!username || !password) {
            alert("Please enter both username and password");
            return;
        }

        fetch("http://localhost:8080/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.text())
        .then(msg => {
            alert(msg);
            if (msg.toLowerCase().includes("success")) {
                window.location.href = "login.html";
            }
        })
        .catch(err => {
            console.error("Signup Error:", err);
            alert("Unable to connect to the server. Please ensure the backend is running.");
        });
    }
    </script>
</body>
</html>
