<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BudgetFlow</title>
    <link rel="stylesheet" href="styleET.css">
</head>
<body>
    <div class="Navbar">
        <h3 id="mainHeading">BudgetFlow</h3>
        <nav id="anchors"> 
            <a href="home.html">Home</a> |
            <a href="index1.html">Track Expenses</a> |
            <a href="login.html">Login/Signup</a>
        </nav>
    </div>

    <div class="auth-container">
        <h2>Login</h2>
        <form id="login" onsubmit="event.preventDefault(); login();">
            <input id="username" type="text" placeholder="Username" required />
            <input id="password" type="password" placeholder="Password" required />

            <button type="submit" id="loginBtn">Login</button>

            <p>Don't have an account? <a href="signup.html">Sign up</a></p>
        </form>
    </div>

    <footer>
        <p>© 2026 Personal Expense Tracker</p>
    </footer>

    <script>
    function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!username || !password) {
            alert("Please enter both username and password");
            return;
        }

        fetch("http://localhost:8080/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
        })
        .then(res => {
            if (!res.ok && res.status !== 401 && res.status !== 400) {
                throw new Error("Server error");
            }
            return res.text();
        })
        .then(token => {
            if (!token || token === "Invalid credentials") {
                alert("Login failed: Invalid credentials");
                return;
            }

            localStorage.setItem("token", token);
            localStorage.setItem("username", username);
            alert("Login successful");
            window.location.href = "index1.html";
        })
        .catch(err => {
            console.error("Login Error:", err);
            alert("Unable to connect to the server. Please ensure the backend is running.");
        });
    }
    </script>
</body>
</html>
